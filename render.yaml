services:
  - type: web
    name: cloudcode
    runtime: node
    region: singapore
    plan: starter
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: node build
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: cloudcode-db
          property: connectionString
